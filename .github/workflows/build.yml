name: Build Windows Application & Installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Build Rust Gateway (Release Mode)
        run: |
          cargo build --release --manifest-path rust-gateway/Cargo.toml

      - name: Create Package Directory Structure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force | Out-Null
          New-Item -ItemType Directory -Path package\bin -Force | Out-Null
          New-Item -ItemType Directory -Path dist -Force | Out-Null

          # Copy Rust binary
          Copy-Item rust-gateway\target\release\rust-gateway.exe package\rust-gateway.exe

          # Copy Application Assets
          Copy-Item backend package\backend -Recurse
          Copy-Item frontend package\frontend -Recurse
          Copy-Item requirements.txt package\requirements.txt
          Copy-Item README.md package\README.md
          Copy-Item start.bat package\start.bat
          Copy-Item setup_and_run.bat package\setup_and_run.bat
          Copy-Item run.ps1 package\run.ps1

          # Ensure data directories exist
          $dataDirs = @("uploads", "outputs", "subtitles", "temp", "models")
          foreach ($d in $dataDirs) {
              $p = "package\data\$d"
              New-Item -ItemType Directory -Path $p -Force | Out-Null
              Set-Content -Path "$p\.gitkeep" -Value ""
          }

      - name: Download and Bundle Standalone FFmpeg & FFprobe
        shell: pwsh
        run: |
          $ffmpegZip = "$env:TEMP\ffmpeg.zip"
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile $ffmpegZip
          
          $extractDir = "$env:TEMP\ffmpeg-extract"
          Expand-Archive -Path $ffmpegZip -DestinationPath $extractDir -Force

          $ffmpegExe = Get-ChildItem -Path $extractDir -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobeExe = Get-ChildItem -Path $extractDir -Recurse -Filter "ffprobe.exe" | Select-Object -First 1

          Copy-Item $ffmpegExe.FullName package\bin\ffmpeg.exe
          Copy-Item $ffprobeExe.FullName package\bin\ffprobe.exe
          Write-Host "FFmpeg and FFprobe successfully bundled into package\bin"

      - name: Bundle Standalone Python Embeddable Runtime
        shell: pwsh
        run: |
          Write-Host "Setting up Python 3.11 Embeddable Package..."
          $pyZip = "$env:TEMP\python-embed.zip"
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip" -OutFile $pyZip
          New-Item -ItemType Directory -Path package\python -Force | Out-Null
          Expand-Archive -Path $pyZip -DestinationPath "package\python" -Force

          # Enable site-packages in python311._pth
          $pthFile = "package\python\python311._pth"
          $pthLines = Get-Content $pthFile
          $pthLines = $pthLines -replace "#import site", "import site"
          $pthLines += "`nLib\site-packages`n..`n."
          Set-Content -Path $pthFile -Value $pthLines

          # Install pip into embedded python
          $getPip = "$env:TEMP\get-pip.py"
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile $getPip
          & package\python\python.exe $getPip --no-warn-script-location

          # Install all requirements directly into the embedded runtime
          & package\python\python.exe -m pip install -r requirements.txt --no-warn-script-location

          # Verify embedded python can import dependencies
          & package\python\python.exe -c "import fastapi, uvicorn, faster_whisper; print('[OK] Embedded Python verified successfully.')"

          # Clean pycache to reduce installer size
          Get-ChildItem -Path package\python -Recurse -Directory -Filter "__pycache__" | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

      - name: Compile Inno Setup Windows Installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
              choco install innosetup --no-progress
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          Write-Host "Installer compiled: dist\WhisperStudio-Setup-x64.exe"

      - name: Create Portable Zip Distribution
        shell: pwsh
        run: |
          Compress-Archive -Path "package\*" -DestinationPath "dist\WhisperStudio-Portable-x64.zip" -CompressionLevel Optimal
          Write-Host "Portable archive created: dist\WhisperStudio-Portable-x64.zip"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WhisperStudio-Windows-x64
          path: |
            dist/WhisperStudio-Setup-x64.exe
            dist/WhisperStudio-Portable-x64.zip

      - name: Publish GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WhisperStudio-Setup-x64.exe
            dist/WhisperStudio-Portable-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true

